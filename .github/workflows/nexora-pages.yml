name: Deploy Nexora AI Studio to GitHub Pages
on:
  push:
    branches: [nexora-ai-studio]
    paths:
      - 'nexora-ai/**'
      - '.github/workflows/nexora-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nexora-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexora-ai-studio
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexora-ai
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
